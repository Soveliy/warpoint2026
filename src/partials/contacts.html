<section class="contacts" id="contacts" data-header-theme="brand" aria-labelledby="contacts-title">
  <div class="contacts__container container">
    <h2 class="contacts__title" id="contacts-title">Как нас <span>найти</span></h2>

    <div class="contacts__card">
      <div class="contacts__content">
        <h3 class="contacts__city" data-contacts-city>Екатеринбург</h3>
        <div
          class="contacts__select"
          data-contacts-select
          data-country-id="ru"
          data-city-name="Екатеринбург"
          data-selected-location-id="raduga-park"
        >
          <button
            class="contacts__location button-reset"
            type="button"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="contacts-location-list"
            aria-label="Выбрать локацию: ТРЦ «Радуга Парк»"
            data-contacts-select-toggle
          >
            <span data-contacts-location>ТРЦ «Радуга Парк»</span>
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="m3 6 5 4 5-4" />
            </svg>
          </button>
          <div
            class="contacts__location-list"
            id="contacts-location-list"
            role="listbox"
            aria-label="Локации в Екатеринбурге"
            data-contacts-location-list
            hidden
          ></div>
        </div>

        <div class="contacts__details">
          <h4 class="contacts__label">Адрес и телефон:</h4>
          <address class="contacts__address">
            <div class="contacts__row">
              <svg class="contacts__icon" viewBox="0 0 32 32" aria-hidden="true">
                <path
                  fill="currentColor"
                  stroke="none"
                  d="M16 2a8 8 0 0 0-8 8c0 6 8 13 8 13s8-7 8-13a8 8 0 0 0-8-8Zm0 5a3 3 0 1 1 0 6 3 3 0 0 1 0-6Z"
                />
                <path d="M9 20c-4 1-6 2.5-6 4.5C3 27 9 29 16 29s13-2 13-4.5c0-2-2-3.5-6-4.5" />
              </svg>
              <div>
                <span data-contacts-address>ул. Репина, 94</span><br />
                <span data-contacts-address-location>ТРЦ «Радуга Парк»</span>
              </div>
            </div>
            <div class="contacts__row" data-contacts-metro-row hidden>
              <svg
                class="contacts__icon contacts__icon--metro"
                viewBox="0 0 32 36"
                aria-hidden="true"
              >
                <path d="M6 25A14 14 0 1 1 26 25L16 35" />
                <path
                  d="m7 20 5-13 4 8 4-8 5 13h-6l-2-6-1 3-1-3-2 6Z"
                  fill="currentColor"
                  stroke="none"
                />
              </svg>
              <span data-contacts-metro></span>
            </div>
            <div class="contacts__row" data-contacts-ekaterinburg>
              <svg class="contacts__icon" viewBox="0 0 32 32" aria-hidden="true">
                <rect x="8" y="2" width="16" height="28" rx="2" />
                <path d="M8 5h16M8 26h16" />
              </svg>
              <a href="tel:+73432895700">+7 (343) 289-57-00</a>
            </div>
            <div class="contacts__row" data-contacts-ekaterinburg>
              <svg class="contacts__icon" viewBox="0 0 32 32" aria-hidden="true">
                <path d="M3 7h26v19H3Zm0 0 13 12L29 7M3 26l9-10m17 10-9-10" />
              </svg>
              <a href="mailto:ekb@warpoint.ru">ekb@warpoint.ru</a>
            </div>
          </address>
        </div>

        <div class="contacts__hours" data-contacts-ekaterinburg>
          <h4 class="contacts__label">Время работы:</h4>
          <dl class="contacts__schedule">
            <div>
              <dt>Пн-Чт</dt>
              <dd>12:00 - 22:00</dd>
            </div>
            <div>
              <dt>Пт</dt>
              <dd>12:00 - 22:00</dd>
            </div>
            <div>
              <dt>Сб</dt>
              <dd>10:00 - 00:00</dd>
            </div>
            <div>
              <dt>Вс</dt>
              <dd>10:00 - 23:00</dd>
            </div>
          </dl>
        </div>

        <div class="contacts__socials" aria-label="Социальные сети" data-contacts-ekaterinburg>
          <a class="contacts__social" href="#" aria-label="ВКонтакте">
            <svg class="contacts__social-icon" aria-hidden="true">
              <use href="/img/sprite.svg#icon-vk"></use>
            </svg>
          </a>
          <a class="contacts__social" href="#" aria-label="Макс">
            <svg class="contacts__social-icon" aria-hidden="true">
              <use href="/img/sprite.svg#icon-max"></use>
            </svg>
          </a>
        </div>

        <button class="contacts__booking button-reset" type="button" data-booking-open>
          <svg class="contacts__booking-icon" aria-hidden="true">
            <use href="/img/sprite.svg#icon-game"></use>
          </svg>
          <span>Забронировать игру</span>
        </button>
      </div>

      <div
        class="contacts__map"
        data-yandex-map
        data-map-title="Warpoint в ТРЦ Радуга Парк на Яндекс Картах"
        data-map-src="https://yandex.ru/map-widget/v1/?mode=search&amp;text=%D0%A2%D0%A0%D0%A6%20%D0%A0%D0%B0%D0%B4%D1%83%D0%B3%D0%B0%20%D0%9F%D0%B0%D1%80%D0%BA%2C%20%D0%95%D0%BA%D0%B0%D1%82%D0%B8%D0%BD%D0%B1%D1%83%D1%80%D0%B3&amp;z=16"
        aria-busy="true"
      >
        <div class="contacts__map-placeholder" aria-hidden="true"></div>
        <span class="visually-hidden" data-map-status>Карта загружается</span>

        <noscript>
          <iframe
            class="contacts__map-frame contacts__map-frame--noscript"
            src="https://yandex.ru/map-widget/v1/?mode=search&amp;text=%D0%A2%D0%A0%D0%A6%20%D0%A0%D0%B0%D0%B4%D1%83%D0%B3%D0%B0%20%D0%9F%D0%B0%D1%80%D0%BA%2C%20%D0%95%D0%BA%D0%B0%D1%82%D0%B8%D0%BD%D0%B1%D1%83%D1%80%D0%B3&amp;z=16"
            title="Warpoint в ТРЦ Радуга Парк на Яндекс Картах"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
            allowfullscreen
          ></iframe>
        </noscript>

        <div class="contacts__parking" data-contacts-ekaterinburg>
          <svg class="contacts__parking-icon" viewBox="0 0 48 40" aria-hidden="true">
            <path
              d="m8 14 5-11h22l5 11M2 16h5m34 0h5"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="m8 14-4 8v12h4v4h6v-4h20v4h6v-4h4V22l-4-8Zm3 9h6v4h-6Zm20 0h6v4h-6Z"
              fill="currentColor"
            />
          </svg>
          <p>Удобный подъезд<br />и бесплатная парковка на 3 часа</p>
        </div>
      </div>
    </div>
  </div>
</section>
