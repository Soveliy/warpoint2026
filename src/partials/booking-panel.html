<div class="booking-panel" id="booking-panel" aria-hidden="true" data-booking-panel inert>
  <button
    class="booking-panel__backdrop button-reset"
    type="button"
    tabindex="-1"
    aria-label="Закрыть окно бронирования"
    data-booking-close
  ></button>

  <aside
    class="booking-panel__dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="booking-panel-title"
    aria-describedby="booking-panel-description"
    tabindex="-1"
    data-booking-dialog
  >
    <button
      class="booking-panel__close button-reset"
      type="button"
      aria-label="Закрыть окно бронирования"
      data-booking-close
    >
      <span></span>
      <span></span>
    </button>

    <section class="booking-panel__online">
      <h2 class="booking-panel__title" id="booking-panel-title">
        <span>Запишитесь</span>
        <span>онлайн</span>
      </h2>
      <p class="booking-panel__subtitle" id="booking-panel-description">
        Выберите игровую зону, дату<br />и удобное время
      </p>

      <button
        class="booking-panel__button booking-panel__button--online button-reset"
        type="button"
        data-booking-online
      >
        Записаться онлайн
      </button>
    </section>

    <section class="booking-panel__request" aria-labelledby="booking-request-title">
      <h3 class="booking-panel__request-title" id="booking-request-title">
        Или оставьте заявку и мы свяжемся с вами
      </h3>

      <form class="booking-panel__form" data-booking-form data-callback-form novalidate>
        <div class="booking-panel__fields">
          <label class="visually-hidden" for="booking-name">Ваше имя</label>
          <input
            class="booking-panel__input"
            id="booking-name"
            name="name"
            type="text"
            placeholder="Имя"
            autocomplete="name"
            minlength="2"
            data-validate
            required
          />

          <label class="visually-hidden" for="booking-phone">Телефон</label>
          <input
            class="booking-panel__input"
            id="booking-phone"
            name="phone"
            type="tel"
            placeholder="+7 (000) 000-00-00"
            autocomplete="tel"
            inputmode="tel"
            data-phone-mask
            data-validate
            required
          />
        </div>

        <label class="booking-panel__agreement">
          <input
            class="booking-panel__agreement-input visually-hidden"
            name="agreement"
            type="checkbox"
            data-validate
            required
          />
          <span class="booking-panel__agreement-box" aria-hidden="true"></span>
          <span>
            Я согласен на обработку персональных данных в соответствии с
            <a href="/legal/privacy/">Политикой конфиденциальности</a>, а также с условиями
            <a href="/legal/agreement/">Пользовательского соглашения</a>
          </span>
        </label>

        <button
          class="booking-panel__button booking-panel__button--submit button-reset"
          type="submit"
          data-booking-submit
          disabled
        >
          Оставить заявку
        </button>
      </form>
    </section>
  </aside>
</div>
