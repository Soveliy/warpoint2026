<div class="booking-panel" id="booking-panel" aria-hidden="true" data-booking-panel>
  <button class="booking-panel__backdrop button-reset" type="button" tabindex="-1"
    aria-label="Закрыть панель бронирования" data-booking-close></button>

  <aside class="booking-panel__dialog" role="dialog" aria-modal="true" aria-labelledby="booking-panel-title"
    tabindex="-1" data-booking-dialog>
    <article class="booking-panel__card booking-panel__card--online">
      <div class="booking-panel__copy">
        <h2 class="booking-panel__title" id="booking-panel-title">Забронируйте игру онлайн</h2>
        <p class="booking-panel__subtitle">Запишитесь онлайн на удобное для вас время</p>
      </div>

      <button class="booking-panel__button booking-panel__button--online button-reset" type="button"
        data-booking-online>
        Забронировать онлайн
      </button>

      <img class="booking-panel__man" src="img/form_man.png" width="240" height="327" alt="" aria-hidden="true"
        loading="lazy" decoding="async" />
    </article>

    <article class="booking-panel__card booking-panel__card--request">
      <div class="booking-panel__copy">
        <h2 class="booking-panel__title">Или оставьте заявку</h2>
        <p class="booking-panel__subtitle">Мы перезвоним и подберём удобное время</p>
      </div>

      <form class="booking-panel__form" data-booking-form data-callback-form novalidate>
        <div class="booking-panel__fields">
          <label class="visually-hidden" for="booking-name">Ваше имя</label>
          <input class="booking-panel__input" id="booking-name" name="name" type="text" placeholder="Ваше имя"
            autocomplete="name" minlength="2" data-validate required />

          <label class="visually-hidden" for="booking-phone">Телефон</label>
          <input class="booking-panel__input" id="booking-phone" name="phone" type="tel"
            placeholder="+7 (000) 000-00-00" autocomplete="tel" inputmode="tel" data-phone-mask data-validate
            required />
        </div>

        <label class="booking-panel__agreement">
          <input class="booking-panel__agreement-input visually-hidden" name="agreement" type="checkbox" data-validate
            required />
          <span class="booking-panel__agreement-box" aria-hidden="true"></span>
          <span>
            Принимаю условия
            <a href="/privacy/">политики конфиденциальности</a>
            и даю согласие на обработку персональных данных
          </span>
        </label>

        <button class="booking-panel__button booking-panel__button--submit button-reset" type="submit"
          data-booking-submit disabled>
          Оставить заявку
        </button>
      </form>

      <img class="booking-panel__woman" src="img/form_girl.png" width="378" height="438" alt="" aria-hidden="true"
        loading="lazy" decoding="async" />
    </article>
  </aside>
</div>
