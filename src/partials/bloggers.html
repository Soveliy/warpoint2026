<section class="bloggers" data-header-theme="dark" aria-labelledby="bloggers-title" data-slider-root>
  <h2 class="bloggers__title" id="bloggers-title">Блогеры играют<br />в Warpoint</h2>

  <div class="bloggers__slider swiper" data-slider data-bloggers-slider>
    <div class="swiper-wrapper">
      <article class="bloggers__slide swiper-slide">
        <div class="bloggers__media">
          <img class="bloggers__image" src="img/bloggers/3.jpg" width="1800" height="1050"
            alt="Команда играет в шлемах виртуальной реальности" loading="lazy" decoding="async" />
          <button class="bloggers__play button-reset" type="button" aria-label="Смотреть видео о командной игре"
            data-blogger-video>
            <svg class="bloggers__play-icon" aria-hidden="true">
              <use href="/img/sprite.svg#icon-play"></use>
            </svg>
          </button>
        </div>
        <div class="bloggers__info">
          <div class="bloggers__info-item">
            <div class="bloggers__info-item-row">
              <div class="bloggers__info-item-avatar">
                <img src="img/avatar.jpg" alt="">
              </div>
              <div class="bloggers__info-item-content">
                <div class="bloggers__info-item-name">
                  WYLSACOM
                </div>
                <div class="bloggers__info-item-type">
                  Блогер
                </div>
              </div>
            </div>
          </div>
          <div class="bloggers__info-item">
            <div class="bloggers__info-item-content">
              <div class="bloggers__info-item-name">10,3
                млн</div>
              <div class="bloggers__info-item-type">
                подписчиков</div>
            </div>
          </div>
        </div>
      </article>

      <article class="bloggers__slide swiper-slide">
        <div class="bloggers__media">
          <img class="bloggers__image" src="img/bloggers/2.jpg" width="1800" height="1050"
            alt="Игрок в VR-шлеме с контроллерами" loading="lazy" decoding="async" />
          <button class="bloggers__play button-reset" type="button" aria-label="Смотреть обзор Warpoint"
            data-blogger-video>
            <svg class="bloggers__play-icon" aria-hidden="true">
              <use href="/img/sprite.svg#icon-play"></use>
            </svg>
          </button>
          <div class="bloggers__info">
            <div class="bloggers__info-item">
              <div class="bloggers__info-item-row">
                <div class="bloggers__info-item-avatar">
                  <img src="img/avatar.jpg" alt="">
                </div>
                <div class="bloggers__info-item-content">
                  <div class="bloggers__info-item-name">
                    WYLSACOM
                  </div>
                  <div class="bloggers__info-item-type">
                    Блогер
                  </div>
                </div>
              </div>
            </div>
            <div class="bloggers__info-item">
              <div class="bloggers__info-item-content">
                <div class="bloggers__info-item-name">10,3
                  млн</div>
                <div class="bloggers__info-item-type">
                  подписчиков</div>
              </div>
            </div>
          </div>
        </div>
      </article>

      <article class="bloggers__slide swiper-slide">
        <div class="bloggers__media">
          <img class="bloggers__image" src="img/bloggers/3.jpg" width="1800" height="1050"
            alt="Юный игрок в шлеме виртуальной реальности" loading="lazy" decoding="async" />
          <button class="bloggers__play button-reset" type="button" aria-label="Смотреть видео о VR-игре"
            data-blogger-video>
            <svg class="bloggers__play-icon" aria-hidden="true">
              <use href="/img/sprite.svg#icon-play"></use>
            </svg>
          </button>
          <div class="bloggers__info">
            <div class="bloggers__info-item">
              <div class="bloggers__info-item-row">
                <div class="bloggers__info-item-avatar">
                  <img src="img/avatar.jpg" alt="">
                </div>
                <div class="bloggers__info-item-content">
                  <div class="bloggers__info-item-name">
                    WYLSACOM
                  </div>
                  <div class="bloggers__info-item-type">
                    Блогер
                  </div>
                </div>
              </div>
            </div>
            <div class="bloggers__info-item">
              <div class="bloggers__info-item-content">
                <div class="bloggers__info-item-name">10,3
                  млн</div>
                <div class="bloggers__info-item-type">
                  подписчиков</div>
              </div>
            </div>
          </div>
        </div>
      </article>
    </div>
  </div>

  <div class="bloggers__controls">
    <button class="bloggers__arrow bloggers__arrow--prev button-reset" type="button" aria-label="Предыдущее видео"
      data-slider-prev>
      <svg class="bloggers__arrow-icon" aria-hidden="true">
        <use href="/img/sprite.svg#icon-chevron_left"></use>
      </svg>
    </button>
    <button class="bloggers__arrow bloggers__arrow--next button-reset" type="button" aria-label="Следующее видео"
      data-slider-next>
      <svg class="bloggers__arrow-icon" aria-hidden="true">
        <use href="/img/sprite.svg#icon-chevron_left"></use>
      </svg>
    </button>
  </div>
</section>
