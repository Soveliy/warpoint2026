<aside class="cookie-notice" aria-label="Использование файлов cookie" data-cookie-notice hidden>
  <div class="cookie-notice__icon" aria-hidden="true">
    <svg viewBox="0 0 32 32">
      <path d="M28 17A12 12 0 1 1 15 4a7 7 0 0 0 7 8 6 6 0 0 0 6 5Z" />
      <circle cx="10" cy="15" r="1" />
      <circle cx="16" cy="22" r="1" />
      <circle cx="9" cy="22" r="1" />
      <circle cx="19" cy="16" r="1" />
    </svg>
  </div>
  <div class="cookie-notice__content">
    <p>
      Мы используем файлы cookie, чтобы сайт работал корректно и был удобнее. Подробности — в
      <a href="/legal/cookies/">политике использования cookie</a>.
    </p>
    <div class="cookie-notice__actions">
      <button class="cookie-notice__accept btn btn--red" type="button" data-cookie-accept>
        Принять
      </button>
    </div>
  </div>
  <button
    class="cookie-notice__close button-reset"
    type="button"
    aria-label="Закрыть уведомление о cookie"
    data-cookie-close
  >
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
  </button>
</aside>
