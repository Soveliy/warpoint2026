<section
  class="immersive-showcase"
  id="immersion"
  data-header-theme="brand"
  aria-labelledby="immersive-showcase-title"
>
  <div class="immersive-showcase__container container">
    <div class="immersive-showcase__card" data-reveal-image>
      <div class="immersive-showcase__content">
        <h2 class="immersive-showcase__title" id="immersive-showcase-title">
          Невероятный<br />уровень<br /><span>погружения</span>
        </h2>
        <ul>
          <li>Свободное перемещение по всей арене</li>
          <li>Никаких проводов и тяжёлых рюкзаков</li>
          <li>Участники видят друг друга и могут взаимодействовать</li>
          <li>Нужно активно двигаться и слаженно работать в команде</li>
        </ul>
      </div>
      <div class="immersive-showcase__media">
        <video
          class="immersive-showcase__image"
          autoplay
          muted
          loop
          playsinline
          preload="metadata"
          poster="img/showcase/1.jpg"
          aria-hidden="true"
        >
          <source src="video/corporate-immersion.mp4" type="video/mp4" />
        </video>
      </div>
    </div>
  </div>
</section>
