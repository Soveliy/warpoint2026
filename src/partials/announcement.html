<!-- Remove this include or add hidden to disable the optional announcement. -->
<aside class="announcement" aria-label="Анонс Warpoint" data-announcement="new-games">
  <img
    class="announcement__image"
    src="img/zones/арена.jpg"
    width="96"
    height="96"
    alt="Игроки на VR-арене"
    loading="lazy"
  />
  <div class="announcement__content">
    <p>На VR-аренах WARPOINT появились новые игры и детские режимы</p>
    <a class="announcement__link" href="#">Подробнее <span aria-hidden="true">→</span></a>
  </div>
  <button
    class="announcement__close button-reset"
    type="button"
    aria-label="Скрыть анонс"
    data-announcement-close
  >
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
  </button>
</aside>
